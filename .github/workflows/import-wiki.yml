name: Import wiki

# One-off: copies wiki/ from commit 3a5bf9d into the repository's GitHub wiki.
on:
  push:
    branches: [ccr-0b02ebf5-ibobiu]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3a5bf9d8931482c940db125d1d89f42672c1deb9
      - name: Push wiki/ to the wiki repository
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" "$RUNNER_TEMP/wiki"
          cp -r wiki/. "$RUNNER_TEMP/wiki/"
          cd "$RUNNER_TEMP/wiki"
          git add -A
          if git diff --cached --quiet; then echo "wiki already up to date"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898283+github-actions[bot]@users.noreply.github.com" commit -m "Import the documentation"
          git push
          git log --oneline -3
          ls
