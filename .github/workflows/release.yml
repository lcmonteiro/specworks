name: Release

# Publishing a GitHub release (tag vX.Y.Z) runs CI on the tagged commit, builds
# the sdist and wheel, and uploads them to PyPI with trusted publishing (OIDC),
# so the repo holds no PyPI token. PyPI must list this repo, this workflow
# (release.yml) and the `pypi` environment as a trusted publisher of specworks.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build the distributions
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Tag matches the package version
        run: |
          version="$(uv version --short)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match version $version in pyproject.toml (expected v$version)"
            exit 1
          fi

      - name: Build
        run: uv build

      # PyPI rejects any Requires-Dist that is a direct reference (`name @ url`),
      # so fail here with a clear message instead of at upload.
      - name: No direct-reference dependencies
        run: |
          if unzip -p dist/*.whl '*/METADATA' | grep -E '^Requires-Dist: [^ ;]+ @ '; then
            echo "PyPI does not accept direct-reference dependencies (above); depend on a released version instead"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/specworks/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
