name: Release

# Publishing a GitHub release (tag vX.Y.Z) runs CI on the tagged commit, builds
# the sdist and wheel, and attaches them to the release. Nothing goes to PyPI:
# install with `uv tool install <wheel URL from the release>`.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  attach:
    name: Build and attach the distributions
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Tag matches the package version
        run: |
          version="$(uv version --short)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match version $version in pyproject.toml (expected v$version)"
            exit 1
          fi

      - name: Build
        run: uv build

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
