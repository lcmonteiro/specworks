name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    # Windows is not verified yet (the fake d2 in the diagram tests is a shebang script):
    # its job reports without failing the run until the suite is made portable.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        experimental: [false]
        include:
          - os: macos-latest
            python-version: "3.13"
            experimental: false
          - os: windows-latest
            python-version: "3.13"
            experimental: true
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      # pyd2 brings the pinned D2 release, so the diagram tests render with the real d2.
      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest -v

  lint:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff
        run: uv run ruff check src tests

      - name: Mypy
        run: uv run mypy

  package:
    name: Build and smoke-test the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Build
        run: uv build

      - name: Wheel is pure Python and requires pyd2 at a pinned commit
        run: |
          wheel="$(ls dist/*.whl)"
          echo "$wheel"
          case "$wheel" in *-py3-none-any.whl) ;; *) echo "unexpected wheel tag"; exit 1 ;; esac
          unzip -p "$wheel" '*/METADATA' | grep -qx 'Requires-Dist: pyd2 @ git+https://github.com/lcmonteiro/pyd2@[0-9a-f]\{40\}'

      # The CLI reads schema.yaml, templates/ and skills/ (with skills/_shared/,
      # filled into each skill on install) from the installed package, so check
      # they all made it into the wheel.
      - name: Run the installed CLI
        run: |
          wheel="$(ls "$GITHUB_WORKSPACE"/dist/*.whl)"
          sw() { uv tool run --isolated --from "$wheel" specworks "$@"; }
          project="$(mktemp -d)"
          cd "$project"
          sw init --dir spec --tools all
          sw new add-example
          sw instructions refinement --change add-example --json > /dev/null
          sw instructions tasks --change add-example --json > /dev/null
          test -f spec.yml
          test -f .claude/skills/specworks-refine/SKILL.md
          test -f .github/skills/specworks-refine/SKILL.md
          test -f .github/prompts/specworks-refine.prompt.md
          test -f .github/skills/specworks-specify/SKILL.md
          test -f .github/skills/specworks-design/SKILL.md
          test -f .github/skills/specworks-build/SKILL.md
          test -f .github/prompts/specworks-build.prompt.md
          test -f .github/prompts/specworks-design.prompt.md
          test -f .github/skills/specworks-test/SKILL.md
          test -f .github/prompts/specworks-test.prompt.md
          test -f .github/skills/specworks-code/SKILL.md
          test -f .github/skills/specworks-review/SKILL.md
          test -f .github/skills/specworks-validate/SKILL.md
          test -f .github/skills/specworks-close/SKILL.md
          grep -q 'Running the CLI' .claude/skills/specworks-refine/SKILL.md
          grep -q 'Picking the change' .claude/skills/specworks-code/SKILL.md
          if grep -rq 'specworks:include' .claude .github; then echo 'unfilled include in an installed skill'; exit 1; fi
          mkdir -p spec/changes/add-example/diagrams
          printf 'shape: sequence_diagram\nuser -> api: "POST /reset {email}"\n' > spec/changes/add-example/diagrams/flow.d2
          sw diagrams --themes | grep -q '(pyd2)'
          sw diagrams --change add-example
          grep -q 'specworks:d2 sha256=' spec/changes/add-example/diagrams/flow.svg
