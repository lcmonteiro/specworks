name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      # pyd2 brings the pinned D2 release, so the diagram tests render with the real d2.
      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest -v

  lint:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff
        run: uv run ruff check src tests

      - name: Mypy
        run: uv run mypy

  package:
    name: Build and smoke-test the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Build
        run: uv build

      # Pinned to a commit, not a branch: `uv tool install` does not read uv.lock.
      - name: Wheel is pure Python and requires pyd2 at a pinned commit
        run: |
          wheel="$(ls dist/*.whl)"
          echo "$wheel"
          case "$wheel" in *-py3-none-any.whl) ;; *) echo "unexpected wheel tag"; exit 1 ;; esac
          unzip -p "$wheel" '*/METADATA' | grep -qxE 'Requires-Dist: pyd2 @ git\+https://github.com/lcmonteiro/pyd2@[0-9a-f]{40}'

      # The CLI reads schema.yaml, templates/ and skills/ (with skills/_shared/,
      # filled into each skill on install) from the installed package, so check
      # they all made it into the wheel.
      - name: Run the installed CLI
        run: |
          wheel="$(ls "$GITHUB_WORKSPACE"/dist/*.whl)"
          sw() { uv tool run --isolated --from "$wheel" specworks "$@"; }
          project="$(mktemp -d)"
          cd "$project"
          sw init --dir spec --tools all
          sw new add-example
          sw instructions refinement --change add-example --json > /dev/null
          sw instructions tasks --change add-example --json > /dev/null
          test -f spec.yml
          # Every packaged skill, for both tools (the list comes from the source tree).
          for skill in $(cd "$GITHUB_WORKSPACE/src/specworks/skills" && ls -d specworks-*); do
            for f in ".claude/skills/$skill/SKILL.md" ".github/skills/$skill/SKILL.md" ".github/prompts/$skill.prompt.md"; do
              test -f "$f" || { echo "missing $f"; exit 1; }
            done
          done
          grep -q 'Running the CLI' .claude/skills/specworks-refine/SKILL.md
          if grep -rq 'specworks:include' .claude .github; then echo 'unfilled include in an installed skill'; exit 1; fi
          mkdir -p spec/changes/add-example/diagrams
          printf 'shape: sequence_diagram\nuser -> api: "POST /reset {email}"\n' > spec/changes/add-example/diagrams/flow.d2
          sw diagrams --themes | grep -q '(pyd2)'
          sw diagrams --change add-example
          grep -q 'specworks:d2 sha256=' spec/changes/add-example/diagrams/flow.svg
