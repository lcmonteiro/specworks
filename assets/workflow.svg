<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1304 380" width="1304" height="380" role="img" aria-labelledby="title desc">
<title id="title">specworks workflow</title>
<desc id="desc">refine (optional), specify, then the build cycle design, test, code, review, then validate and close. Solid arrows move forward when a phase's gate passes. Dashed lanes go back: to specify when the spec turns out wrong, or to the phase that fixes a problem (review findings, a failed validate or close).</desc>
<style>
  svg { --bg: #ffffff; --ink: #1f2328; --muted: #59636e; --line: #59636e; --back: #9a6700;
        --box: #ffffff; --plan: #ddf4ff; --plan-ink: #0969da; --build: #fbefff; --build-ink: #8250df;
        --finish: #dafbe1; --finish-ink: #1a7f37; }
  @media (prefers-color-scheme: dark) {
    svg { --bg: #0d1117; --ink: #e6edf3; --muted: #9198a1; --line: #9198a1; --back: #d29922;
          --box: #151b23; --plan: #0c2d4b; --plan-ink: #4493f8; --build: #2b1a45; --build-ink: #ab7df8;
          --finish: #0f2e1b; --finish-ink: #3fb950; }
  }
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: var(--ink); }
  .name { font-size: 17px; font-weight: 600; }
  .sub { font-size: 13px; fill: var(--muted); }
  .caption { font-size: 13px; font-weight: 700; letter-spacing: .08em; }
  .note { font-size: 13px; fill: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .label { font-size: 13px; fill: var(--muted); }
  .back-label { font-size: 13px; fill: var(--back); font-weight: 600; }
  .fwd { stroke: var(--line); stroke-width: 2; fill: none; }
  .back { stroke: var(--back); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
  .head { fill: var(--line); }
  .back-head { fill: var(--back); }
  .plan { fill: var(--plan); } .plan-ink { stroke: var(--plan-ink); fill: var(--plan-ink); }
  .build { fill: var(--build); } .build-ink { stroke: var(--build-ink); fill: var(--build-ink); }
  .finish { fill: var(--finish); } .finish-ink { stroke: var(--finish-ink); fill: var(--finish-ink); }
</style>
<rect width="1304" height="380" fill="var(--bg)"/>
<!-- Groups of phases -->
<rect class="plan" x="96" y="40" width="268" height="272" rx="14"/>
<text class="caption" x="114" y="66" style="fill: var(--plan-ink)">PLAN</text>
<rect class="build" x="398" y="40" width="524" height="272" rx="14"/>
<text class="caption" x="416" y="66" style="fill: var(--build-ink)">BUILD CYCLE</text>
<text class="note" x="904" y="66" text-anchor="end">/specworks-build</text>
<rect class="finish" x="956" y="40" width="268" height="272" rx="14"/>
<text class="caption" x="974" y="66" style="fill: var(--finish-ink)">FINISH</text>
<!-- Back to specify: the spec turns out wrong -->
<path class="back" d="M468.0,162 V112"/>
<path class="back" d="M596.0,162 V112"/>
<path class="back" d="M724.0,162 V112"/>
<path class="back" d="M852.0,162 V112"/>
<path class="back" d="M1026.0,162 V112"/>
<path class="back" d="M1026.0,112 H294.0 V150"/>
<path class="back-head" d="M294.0,162.0 L287.0,150.8 L301.0,150.8 Z"/>
<text class="back-label" x="532" y="102" text-anchor="middle">spec turns out wrong: back to specify</text>
<!-- Back to the phase that fixes it: review findings, a failed validate or close -->
<path class="back" d="M447.2,270 V234"/>
<path class="back-head" d="M447.2,222.0 L440.2,233.2 L454.2,233.2 Z"/>
<path class="back" d="M575.2,270 V234"/>
<path class="back-head" d="M575.2,222.0 L568.2,233.2 L582.2,233.2 Z"/>
<path class="back" d="M703.2,270 V234"/>
<path class="back-head" d="M703.2,222.0 L696.2,233.2 L710.2,233.2 Z"/>
<path class="back" d="M831.2,270 V234"/>
<path class="back-head" d="M831.2,222.0 L824.2,233.2 L838.2,233.2 Z"/>
<path class="back" d="M1005.2,270 V234"/>
<path class="back-head" d="M1005.2,222.0 L998.2,233.2 L1012.2,233.2 Z"/>
<path class="back" d="M616.8,222 V270"/>
<path class="back" d="M744.8,222 V270"/>
<path class="back" d="M872.8,222 V270"/>
<path class="back" d="M1046.8,222 V270"/>
<path class="back" d="M1174.8,222 V270"/>
<path class="back" d="M1174.8,270 H447.2"/>
<text class="back-label" x="447" y="294">back to the phase that fixes it (review findings, failed validate)</text>
<!-- Forward: the phase's gate passes -->
<path class="fwd" d="M218.0,192.0 H230.0"/>
<path class="head" d="M242.0,192.0 L230.8,185.0 L230.8,199.0 Z"/>
<path class="fwd" d="M346.0,192.0 H404.0"/>
<path class="head" d="M416.0,192.0 L404.8,185.0 L404.8,199.0 Z"/>
<path class="fwd" d="M520.0,192.0 H532.0"/>
<path class="head" d="M544.0,192.0 L532.8,185.0 L532.8,199.0 Z"/>
<path class="fwd" d="M648.0,192.0 H660.0"/>
<path class="head" d="M672.0,192.0 L660.8,185.0 L660.8,199.0 Z"/>
<path class="fwd" d="M776.0,192.0 H788.0"/>
<path class="head" d="M800.0,192.0 L788.8,185.0 L788.8,199.0 Z"/>
<path class="fwd" d="M904.0,192.0 H962.0"/>
<path class="head" d="M974.0,192.0 L962.8,185.0 L962.8,199.0 Z"/>
<path class="fwd" d="M1078.0,192.0 H1090.0"/>
<path class="head" d="M1102.0,192.0 L1090.8,185.0 L1090.8,199.0 Z"/>
<!-- Start: a new change, refined first unless it is small -->
<circle cx="40" cy="192.0" r="9" class="head"/>
<text class="label" x="40" y="170.0" text-anchor="middle">new</text>
<path class="fwd" d="M49,192.0 H102.0"/>
<path class="head" d="M114.0,192.0 L102.8,185.0 L102.8,199.0 Z"/>
<path class="fwd" d="M40,201.0 V244 Q40,254 50,254 H284.0 Q294.0,254 294.0,244 V234"/>
<path class="head" d="M294.0,222.0 L287.0,233.2 L301.0,233.2 Z"/>
<text class="label" x="166" y="274" text-anchor="middle">small change: skip refine</text>
<!-- Done: merged into the living specs and archived -->
<path class="fwd" d="M1206.0,192.0 H1238.0"/>
<path class="head" d="M1250.0,192.0 L1238.8,185.0 L1238.8,199.0 Z"/>
<circle cx="1264" cy="192.0" r="13" fill="none" class="fwd"/>
<circle cx="1264" cy="192.0" r="7" class="head"/>
<text class="label" x="1264" y="166.0" text-anchor="middle">done</text>
<!-- Phases -->
<rect x="114" y="162" width="104" height="60" rx="10" fill="var(--box)" stroke="var(--plan-ink)" stroke-width="2"/>
<text class="name" x="166" y="188" text-anchor="middle">refine</text>
<text class="sub" x="166" y="207" text-anchor="middle">optional</text>
<rect x="242" y="162" width="104" height="60" rx="10" fill="var(--box)" stroke="var(--plan-ink)" stroke-width="2"/>
<text class="name" x="294" y="188" text-anchor="middle">specify</text>
<text class="sub" x="294" y="207" text-anchor="middle">specs + tasks</text>
<rect x="416" y="162" width="104" height="60" rx="10" fill="var(--box)" stroke="var(--build-ink)" stroke-width="2"/>
<text class="name" x="468" y="188" text-anchor="middle">design</text>
<text class="sub" x="468" y="207" text-anchor="middle">API stubs</text>
<rect x="544" y="162" width="104" height="60" rx="10" fill="var(--box)" stroke="var(--build-ink)" stroke-width="2"/>
<text class="name" x="596" y="188" text-anchor="middle">test</text>
<text class="sub" x="596" y="207" text-anchor="middle">failing tests</text>
<rect x="672" y="162" width="104" height="60" rx="10" fill="var(--box)" stroke="var(--build-ink)" stroke-width="2"/>
<text class="name" x="724" y="188" text-anchor="middle">code</text>
<text class="sub" x="724" y="207" text-anchor="middle">tests green</text>
<rect x="800" y="162" width="104" height="60" rx="10" fill="var(--box)" stroke="var(--build-ink)" stroke-width="2"/>
<text class="name" x="852" y="188" text-anchor="middle">review</text>
<text class="sub" x="852" y="207" text-anchor="middle">review.md</text>
<rect x="974" y="162" width="104" height="60" rx="10" fill="var(--box)" stroke="var(--finish-ink)" stroke-width="2"/>
<text class="name" x="1026" y="188" text-anchor="middle">validate</text>
<text class="sub" x="1026" y="207" text-anchor="middle">PASS / FAIL</text>
<rect x="1102" y="162" width="104" height="60" rx="10" fill="var(--box)" stroke="var(--finish-ink)" stroke-width="2"/>
<text class="name" x="1154" y="188" text-anchor="middle">close</text>
<text class="sub" x="1154" y="207" text-anchor="middle">living docs</text>
<!-- Legend -->
<path class="fwd" d="M96,352 H136"/>
<path class="head" d="M142.0,352.0 L130.8,345.0 L130.8,359.0 Z"/>
<text class="label" x="152" y="357">the phase's gate passes (specworks start / gate)</text>
<path class="back" d="M516,352 H556"/>
<path class="back-head" d="M562.0,352.0 L550.8,345.0 L550.8,359.0 Z"/>
<text class="label" x="572" y="357">goes back to an earlier phase</text>
<text class="label" x="816" y="357"><tspan style="fill: var(--build-ink); font-weight: 700">↻</tspan>  the build cycle repeats until the review is clean</text>
</svg>
