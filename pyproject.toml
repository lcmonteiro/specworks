[project]
name = "specworks"
version = "0.1.0"
description = "Spec-driven development workflow (refine → propose → test → implement → review → verify → close) for AI coding agents"
readme = "README.md"
authors = [
    { name = "lcmonteiro", email = "monteiro.lcm@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.3",
    "typer>=0.27.3",
]

[project.scripts]
specworks = "specworks.cli:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/specworks"]
# The D2 binary is added per platform by hatch_build.py, never from the source tree.
exclude = ["src/specworks/bin"]

[tool.hatch.build.targets.sdist]
include = ["src/specworks", "hatch_build.py", "README.md", "tests"]
exclude = ["src/specworks/bin"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[dependency-groups]
dev = [
    "hatchling>=1.32.4",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
