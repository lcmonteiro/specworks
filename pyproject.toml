[project]
name = "specworks"
version = "0.1.0"
description = "Spec-driven development workflow (refine → specify → design → test → code → review → validate → close) for AI coding agents"
readme = "README.md"
authors = [
    { name = "lcmonteiro", email = "monteiro.lcm@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    # D2 and its Python API, pinned to a pyd2 commit so every install (uv tool install too,
    # which does not read uv.lock) gets the same D2. To upgrade, put a newer commit here and run `uv lock`.
    "pyd2 @ git+https://github.com/lcmonteiro/pyd2@3f82c049daada03a0c8ab6e0a6fd5d8fe75c69cb",
    "pyyaml>=6.0.3",
    "typer>=0.27.3",
]

[project.optional-dependencies]
# `specworks harness`: the specworks flow as a chatinho chat of Deep Agent peers. chatinho needs Python 3.12+,
# and is pinned to a commit because SkillPeer overrides AgentConnector.graph(). Imported only by that command.
harness = [
    "chatinho[tui,langchain] @ git+https://github.com/lcmonteiro/chatinho@d3f29a263d323774c0820eb21b8276f25b170372 ; python_version >= '3.12'",
    "deepagents>=0.7,<0.8; python_version >= '3.12'",
]

[project.scripts]
specworks = "specworks.cli:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/specworks"]

[tool.hatch.build.targets.sdist]
include = ["src/specworks", "README.md", "tests"]

# pyd2 is a git dependency (a direct reference in the package metadata).
[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "coverage>=7.16.2",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "types-pyyaml>=6.0.12.20260906",
    # The harness extra, so `uv sync` on 3.12+ installs what tests/harness needs.
    "chatinho[tui,langchain] @ git+https://github.com/lcmonteiro/chatinho@d3f29a263d323774c0820eb21b8276f25b170372 ; python_version >= '3.12'",
    "deepagents>=0.7,<0.8; python_version >= '3.12'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Each capability's tests are in tests/<capability>/, where file names repeat.
pythonpath = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
src = ["src", "tests"]
target-version = "py311"
# Long enough that imports stay on one line, grouped stdlib / third party / specworks.
line-length = 170

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false  # a trailing comma does not keep an import wrapped

[tool.ruff.lint.flake8-bugbear]
# Typer declares options as default values.
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.mypy]
files = ["src/specworks"]
python_version = "3.11"
check_untyped_defs = true

# The harness's dependencies need Python 3.12+; the lint job runs on 3.11 without them.
[[tool.mypy.overrides]]
module = ["chatinho.*", "deepagents.*", "langchain_core.*", "langchain_openai.*", "pydantic.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["specworks"]
branch = true

[tool.coverage.report]
fail_under = 95
skip_covered = true
show_missing = true
