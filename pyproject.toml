[project]
name = "specworks"
version = "0.1.0"
description = "Spec-driven development workflow (refine → propose → test → implement → review → verify → close) for AI coding agents"
readme = "README.md"
authors = [
    { name = "lcmonteiro", email = "monteiro.lcm@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    # D2 (v0.7.1) and its Python render API, built from the pyd2 repo at this commit.
    "pyd2 @ git+https://github.com/lcmonteiro/pyd2@fddf09561c713644f3e04836665faa7bd9e18bab",
    "pyyaml>=6.0.3",
    "typer>=0.27.3",
]

[project.scripts]
specworks = "specworks.cli:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/specworks"]

[tool.hatch.build.targets.sdist]
include = ["src/specworks", "README.md", "tests"]

# pyd2 is a git dependency (a direct reference in the package metadata).
[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
