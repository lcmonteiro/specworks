[project]
name = "specworks"
version = "0.1.0"
description = "Spec-driven development workflow (refine → propose → test → implement → review → verify → close) for AI coding agents"
readme = "README.md"
authors = [
    { name = "lcmonteiro", email = "monteiro.lcm@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "d2-bin==0.7.1",
    "pyyaml>=6.0.3",
    "typer>=0.27.3",
]

[project.scripts]
specworks = "specworks.cli:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/specworks"]

[tool.hatch.build.targets.sdist]
include = ["src/specworks", "README.md", "tests"]

# Until d2-bin 0.7.1 is on PyPI, develop against its merged main (same version).
[tool.uv.sources]
d2-bin = { git = "https://github.com/lcmonteiro/d2-bin", rev = "44c309276a53d38b546cbd456a11de50d09df878" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
