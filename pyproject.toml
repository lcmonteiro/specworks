[project]
name = "specworks"
version = "0.1.0"
description = "Spec-driven development workflow (refine → propose → test → implement → review → verify → close) for AI coding agents"
readme = "README.md"
authors = [
    { name = "lcmonteiro", email = "monteiro.lcm@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    # D2 and its Python API, from pyd2's main branch. uv.lock pins the commit;
    # `uv lock --upgrade-package pyd2` moves it to the latest main.
    "pyd2 @ git+https://github.com/lcmonteiro/pyd2@main",
    "pyyaml>=6.0.3",
    "typer>=0.27.3",
]

[project.scripts]
specworks = "specworks.cli:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/specworks"]

[tool.hatch.build.targets.sdist]
include = ["src/specworks", "README.md", "tests"]

# pyd2 is a git dependency (a direct reference in the package metadata).
[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src", "tests"]
target-version = "py311"
# Long enough that imports stay on one line, grouped stdlib / third party / specworks.
line-length = 170

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false  # a trailing comma does not keep an import wrapped

[tool.ruff.lint.flake8-bugbear]
# Typer declares options as default values.
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.mypy]
files = ["src/specworks"]
python_version = "3.11"
check_untyped_defs = true

[[tool.mypy.overrides]]
# pyd2 has no py.typed marker yet; analyse it anyway.
module = ["pyd2", "pyd2.*"]
follow_untyped_imports = true
