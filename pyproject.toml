[project]
name = "specworks"
version = "0.1.0"
description = "Spec-driven development workflow (refine → propose → test → implement → review → verify → close) for AI coding agents"
readme = "README.md"
authors = [
    { name = "lcmonteiro", email = "monteiro.lcm@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    # D2 (v0.7.1) and its Python render API, built from the d2-bin repo at this commit.
    "d2-bin @ git+https://github.com/lcmonteiro/d2-bin@8c7c7d6e68cea5c4f7a68e572cf59f2795ac757c",
    "pyyaml>=6.0.3",
    "typer>=0.27.3",
]

[project.scripts]
specworks = "specworks.cli:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/specworks"]

[tool.hatch.build.targets.sdist]
include = ["src/specworks", "README.md", "tests"]

# d2-bin is a git dependency (a direct reference in the package metadata).
[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
